<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Transaction History | TOP</title>
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="assets/css/top.css">
    <link rel="stylesheet" href="assets/css/top-app.css">
    <meta name="theme-color" content="#E60000">
    <meta name="application-name" content="TOP">
    <style>
.summary-wrapper { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(150px, 46%); gap: 12px; overflow-x: auto; padding: 2px 2px 16px; margin-bottom: -8px; scrollbar-width: none; scroll-snap-type: x mandatory; }
        .summary-wrapper::-webkit-scrollbar { display: none; }
        .summary-wrapper > * { scroll-snap-align: start; }
        @media (min-width: 720px) { .summary-wrapper { grid-auto-flow: row; grid-template-columns: repeat(3, minmax(0, 1fr)); overflow: visible; } }
        @media (min-width: 1100px) { .summary-wrapper { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
        .action-btns { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; padding-top: 14px; border-top: 1px dashed rgba(230,0,0,.14); flex-wrap: wrap; }
        @media (min-width: 960px) { #txList { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 14px; } #txList > .empty-state { grid-column: 1 / -1; } }
    </style>
</head>
<body class="app-body">

    <header class="app-header">
        <div class="container app-header-inner">
            <div class="head-left">
                <a href="dashboard.html" class="back-btn" aria-label="Back to dashboard"><i class="fas fa-arrow-left"></i></a>
                <div class="head-titles">
                    <h1 class="page-title">Transactions</h1>
                    <p class="page-sub">Every naira in and out</p>
                </div>
            </div>
            <div class="header-actions">
                <a href="notifications.html" class="icon-btn" aria-label="Notifications"><i class="fas fa-bell"></i></a>
                <div class="avatar avatar-sm" id="userAvatar">U</div>
            </div>
        </div>
    </header>

    <main class="container app-main">
        <!-- Summary Stats -->
        <section class="summary-wrapper fade-up">
            <div class="stat-card is-hero"><span class="stat-icon"><i class="fas fa-receipt"></i></span><h3 class="stat-value" id="statTotal">0</h3><p class="stat-label">Total</p></div>
            <div class="stat-card"><span class="stat-icon"><i class="fas fa-arrow-up"></i></span><h3 class="stat-value" id="statDeposit">₦0</h3><p class="stat-label">Deposits</p></div>
            <div class="stat-card"><span class="stat-icon"><i class="fas fa-arrow-down"></i></span><h3 class="stat-value" id="statWithdraw">₦0</h3><p class="stat-label">Withdrawals</p></div>
            <div class="stat-card"><span class="stat-icon"><i class="fas fa-chart-line"></i></span><h3 class="stat-value" id="statInvest">₦0</h3><p class="stat-label">Investments</p></div>
            <div class="stat-card"><span class="stat-icon"><i class="fas fa-coins"></i></span><h3 class="stat-value" id="statEarn">₦0</h3><p class="stat-label">Earnings</p></div>
            <div class="stat-card"><span class="stat-icon"><i class="fas fa-user-friends"></i></span><h3 class="stat-value" id="statRef">₦0</h3><p class="stat-label">Ref Bonus</p></div>
        </section>

        <!-- Search & Filter -->
        <section class="card tools-section fade-up d1">
            <div class="tool-row">
                <div class="input-wrapper search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" class="form-control" placeholder="Search ID, Type, or Amount...">
                </div>
                <div class="split">
                    <select id="typeFilter" class="form-control filter-select">
                        <option value="all">All Types</option>
                        <option value="deposit">Deposits</option>
                        <option value="withdrawal">Withdrawals</option>
                        <option value="investment">Investments</option>
                        <option value="earning">Daily Earnings</option>
                        <option value="referral">Referral Bonus</option>
                        <option value="bonus">Welcome Bonus</option>
                        <option value="gift">Gift Codes</option>
                    </select>
                    <select id="dateFilter" class="form-control filter-select">
                        <option value="all">All Time</option>
                        <option value="today">Today</option>
                        <option value="week">Last 7 Days</option>
                        <option value="month">Last 30 Days</option>
                        <option value="year">This Year</option>
                    </select>
                </div>
            </div>
            <!-- Export Area -->
            <div class="action-btns">
                <span class="muted text-sm">Export your history</span>
                <div class="cluster" style="gap:8px;">
                    <button class="btn btn-outline btn-sm" onclick="exportCSV()"><i class="fas fa-file-csv"></i> CSV</button>
                    <button class="btn btn-primary btn-sm" onclick="exportPDF()"><i class="fas fa-file-pdf"></i> PDF</button>
                </div>
            </div>
        </section>

        <!-- Transaction List -->
        <section id="txList" class="tx-list-container fade-up d2">
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
        </section>
    </main>

    <!-- Details Modal -->
    <div class="modal-overlay" id="txModal">
        <div class="modal-card is-form">
            <div class="modal-head">
                <h3>Transaction Details</h3>
                <button type="button" class="modal-close" onclick="closeModal()" aria-label="Close"><i class="fas fa-times"></i></button>
            </div>
            <div id="modalBody" class="kv-list"></div>
            <button class="btn btn-primary btn-lg btn-block mt-4" id="copyIdBtn"><i class="fas fa-copy"></i> Copy Transaction ID</button>
        </div>
    </div>

    <!-- Bottom Nav (left rail on desktop) -->
    <nav class="bottom-nav">
        <a href="dashboard.html" class="rail-brand" aria-label="TOP"><img src="assets/img/logo.svg" alt="TOP"></a>
        <a href="dashboard.html" class="nav-item">
            <i class="fas fa-th-large"></i>
            <span>Home</span>
        </a>
        <a href="plans.html" class="nav-item">
            <i class="fas fa-layer-group"></i>
            <span>Plans</span>
        </a>
        <a href="wallet.html" class="nav-item active">
            <i class="fas fa-wallet"></i>
            <span>Wallet</span>
        </a>
        <a href="notifications.html" class="nav-item">
            <i class="fas fa-bell"></i>
            <span>Alerts</span>
        </a>
        <a href="profile.html" class="nav-item">
            <i class="fas fa-user-circle"></i>
            <span>Profile</span>
        </a>
    </nav>

    <script type="module">
        const SB_URL = import.meta.env.VITE_SUPABASE_URL;
        const SB_KEY = import.meta.env.VITE_SUPABASE_ANON_KEY;
        const supabase = window.supabase.createClient(SB_URL, SB_KEY);

        let currentUser = null;
        let allTransactions = [];
        let filteredTransactions = [];

        async function init() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }
            currentUser = session.user;

            await loadProfile();
            await fetchTransactions();
            
            // Event Listeners
            document.getElementById('searchInput').addEventListener('input', applyFilters);
            document.getElementById('typeFilter').addEventListener('change', applyFilters);
            document.getElementById('dateFilter').addEventListener('change', applyFilters);
        }

        async function loadProfile() {
            const { data } = await supabase.from('profiles').select('full_name').eq('id', currentUser.id).single();
            if (data) document.getElementById('userAvatar').innerText = data.full_name.charAt(0).toUpperCase();
        }

        async function fetchTransactions() {
            const { data, error } = await supabase
                .from('transactions')
                .select('*')
                .eq('user_id', currentUser.id)
                .order('created_at', { ascending: false });

            if (data) {
                allTransactions = data;
                updateStats(data);
                applyFilters();
            }
        }

        function updateStats(data) {
            let dep = 0, wit = 0, inv = 0, ear = 0, ref = 0;
            data.forEach(t => {
                const amt = parseFloat(t.amount);
                if (t.type === 'deposit') dep += amt;
                else if (t.type === 'withdrawal') wit += amt;
                else if (t.type === 'investment') inv += amt;
                else if (t.type === 'earning') ear += amt;
                else if (t.type === 'referral') ref += amt;
            });
            document.getElementById('statTotal').innerText = data.length;
            document.getElementById('statDeposit').innerText = `₦${dep.toLocaleString()}`;
            document.getElementById('statWithdraw').innerText = `₦${wit.toLocaleString()}`;
            document.getElementById('statInvest').innerText = `₦${inv.toLocaleString()}`;
            document.getElementById('statEarn').innerText = `₦${ear.toLocaleString()}`;
            document.getElementById('statRef').innerText = `₦${ref.toLocaleString()}`;
        }

        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const type = document.getElementById('typeFilter').value;
            const dateVal = document.getElementById('dateFilter').value;

            filteredTransactions = allTransactions.filter(t => {
                // Search
                const matchSearch = t.id.toLowerCase().includes(query) || 
                                    t.type.toLowerCase().includes(query) || 
                                    t.amount.toString().includes(query) ||
                                    (t.description && t.description.toLowerCase().includes(query));
                
                // Type
                const matchType = type === 'all' || t.type === type;

                // Date
                let matchDate = true;
                const createdAt = new Date(t.created_at);
                const now = new Date();
                if (dateVal === 'today') matchDate = createdAt.toDateString() === now.toDateString();
                else if (dateVal === 'week') matchDate = (now - createdAt) <= (7 * 86400000);
                else if (dateVal === 'month') matchDate = (now - createdAt) <= (30 * 86400000);
                else if (dateVal === 'year') matchDate = createdAt.getFullYear() === now.getFullYear();

                return matchSearch && matchType && matchDate;
            });

            renderTransactions(filteredTransactions);
        }

        function renderTransactions(data) {
            const container = document.getElementById('txList');
            container.innerHTML = '';

            if (data.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <p>No transactions found matching your criteria.</p>
                        <div style="display:flex; gap:10px; justify-content:center;">
                            <a href="deposit.html" class="btn-copy" style="text-decoration:none; padding:10px 20px;">Deposit Now</a>
                            <a href="plans.html" class="btn-copy" style="text-decoration:none; padding:10px 20px; background:#111827; border:1px solid #333;">Browse Plans</a>
                        </div>
                    </div>
                `;
                return;
            }

            data.forEach(t => {
                const isPositive = ['deposit', 'earning', 'referral', 'bonus', 'gift'].includes(t.type);
                const status = t.status || 'success';
                const date = new Date(t.created_at);
                
                const card = document.createElement('div');
                card.className = 'tx-card';
                card.onclick = () => showDetails(t);
                card.innerHTML = `
                    <div class="tx-main">
                        <h5>${t.description || t.type}</h5>
                        <p>${date.toLocaleDateString()} • ${date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</p>
                    </div>
                    <div class="tx-end">
                        <h4 style="color: ${isPositive ? 'var(--success)' : 'var(--danger)'}">
                            ${isPositive ? '+' : '-'}₦${parseFloat(t.amount).toLocaleString()}
                        </h4>
                        <span class="status-pill ${status}">${status}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.showDetails = (t) => {
            const date = new Date(t.created_at);
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <div class="detail-row"><span>Transaction ID</span><b>${t.id}</b></div>
                <div class="detail-row"><span>Type</span><b>${t.type.toUpperCase()}</b></div>
                <div class="detail-row"><span>Amount</span><b style="color:var(--success)">₦${parseFloat(t.amount).toLocaleString()}</b></div>
                <div class="detail-row"><span>Date & Time</span><b>${date.toLocaleString()}</b></div>
                <div class="detail-row"><span>Status</span><b style="color:var(--success)">${(t.status || 'SUCCESS').toUpperCase()}</b></div>
                <div class="detail-row"><span>Description</span><b>${t.description || 'N/A'}</b></div>
            `;
            
            document.getElementById('copyIdBtn').onclick = () => {
                navigator.clipboard.writeText(t.id);
                alert('ID Copied!');
            };
            
            document.getElementById('txModal').style.display = 'flex';
        };

        window.closeModal = () => document.getElementById('txModal').style.display = 'none';

        window.exportCSV = () => {
            let csv = 'Date,Type,Description,Amount,Status,ID\n';
            filteredTransactions.forEach(t => {
                csv += `${new Date(t.created_at).toLocaleString()},${t.type},${t.description || ''},${t.amount},${t.status || 'success'},${t.id}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', `TOP_Transactions_${new Date().getTime()}.csv`);
            a.click();
        };

        window.exportPDF = () => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            doc.setFontSize(18);
            doc.text("TOP - Transaction Statement", 14, 22);
            doc.setFontSize(11);
            doc.text(`Generated on: ${new Date().toLocaleString()}`, 14, 30);
            
            const rows = filteredTransactions.map(t => [
                new Date(t.created_at).toLocaleDateString(),
                t.type.toUpperCase(),
                t.amount.toLocaleString(),
                (t.status || 'SUCCESS').toUpperCase()
            ]);

            doc.autoTable({
                startY: 40,
                head: [['Date', 'Type', 'Amount (NGN)', 'Status']],
                body: rows,
            });

            doc.save(`TOP_Statement_${new Date().getTime()}.pdf`);
        };

        window.addEventListener('DOMContentLoaded', init);
    </script>
    <script type="module" src="/assets/js/platform.js"></script>
</body>
</html>
