<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notifications | TOP</title>
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="assets/css/top.css">
    <link rel="stylesheet" href="assets/css/top-app.css">
    <meta name="theme-color" content="#E60000">
    <meta name="application-name" content="TOP">
    <style>
.stats-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
        .stats-row .stat-card { padding: 14px 12px; }
        .stats-row .stat-icon { width: 32px; height: 32px; font-size: 13px; margin-bottom: 8px; }
        @media (min-width: 960px) { .notif-wrap { max-width: 860px; } }
        .bulk-actions { align-items: center; flex-wrap: wrap; }
        .bulk-actions .action-link { font-size: 12.5px; }
    </style>
</head>
<body class="app-body">

    <header class="app-header">
        <div class="container app-header-inner">
            <div class="head-left">
                <a href="dashboard.html" class="back-btn" aria-label="Back to dashboard"><i class="fas fa-arrow-left"></i></a>
                <div class="head-titles">
                    <h1 class="page-title">Notifications</h1>
                    <p class="page-sub">Updates on your money</p>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn action-link-btn" onclick="openSettings()" aria-label="Notification settings"><i class="fas fa-cog"></i></button>
                <div class="avatar avatar-sm" id="userAvatar">U</div>
            </div>
        </div>
    </header>

    <main class="container app-main">
        <!-- Stats -->
        <section class="stats-row fade-up">
            <div class="stat-card"><span class="stat-icon"><i class="fas fa-inbox"></i></span><h3 class="stat-value" id="totalCount">0</h3><p class="stat-label">Total</p></div>
            <div class="stat-card is-hero"><span class="stat-icon"><i class="fas fa-envelope"></i></span><h3 class="stat-value" id="unreadCount">0</h3><p class="stat-label">Unread</p></div>
            <div class="stat-card"><span class="stat-icon"><i class="fas fa-calendar-day"></i></span><h3 class="stat-value" id="todayCount">0</h3><p class="stat-label">Today</p></div>
        </section>

        <!-- Search & Filter -->
        <section class="tools fade-up d1">
            <div class="input-wrapper search-bar" style="margin-bottom:14px;">
                <i class="fas fa-search"></i>
                <input type="text" id="notifSearch" class="form-control" placeholder="Search notifications...">
            </div>
            <div class="chip-tabs filter-tabs">
                <button class="tab active" onclick="filterNotifs('all', this)">All</button>
                <button class="tab" onclick="filterNotifs('unread', this)">Unread</button>
                <button class="tab" onclick="filterNotifs('deposit', this)">Deposits</button>
                <button class="tab" onclick="filterNotifs('withdrawal', this)">Withdrawals</button>
                <button class="tab" onclick="filterNotifs('investment', this)">Investments</button>
                <button class="tab" onclick="filterNotifs('earning', this)">Earnings</button>
                <button class="tab" onclick="filterNotifs('referral', this)">Referrals</button>
            </div>
        </section>

        <section class="fade-up d2">
            <!-- Bulk Actions -->
            <div class="section-head bulk-actions">
                <h3>Inbox</h3>
                <div class="cluster" style="gap:6px;">
                    <button class="action-link" onclick="markAllRead()"><i class="fas fa-check-double"></i> Mark all as read</button>
                    <button class="action-link danger" onclick="deleteAllRead()"><i class="fas fa-trash-can"></i> Clear read</button>
                </div>
            </div>

            <!-- List -->
            <div id="notifList">
                <div class="skeleton"></div>
                <div class="skeleton"></div>
            </div>
        </section>
    </main>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-card is-form">
            <div class="modal-head">
                <h3>Notification Settings</h3>
                <button type="button" class="modal-close" onclick="closeSettings()" aria-label="Close"><i class="fas fa-times"></i></button>
            </div>
            <div id="settingsContainer">
                <div class="setting-item"><span>Deposit Alerts</span><label class="switch"><input type="checkbox" checked onchange="savePref('dep', this.checked)"><span class="slider"></span></label></div>
                <div class="setting-item"><span>Investment Alerts</span><label class="switch"><input type="checkbox" checked onchange="savePref('inv', this.checked)"><span class="slider"></span></label></div>
                <div class="setting-item"><span>Daily Earnings</span><label class="switch"><input type="checkbox" checked onchange="savePref('ear', this.checked)"><span class="slider"></span></label></div>
                <div class="setting-item"><span>Withdrawal Status</span><label class="switch"><input type="checkbox" checked onchange="savePref('wit', this.checked)"><span class="slider"></span></label></div>
                <div class="setting-item"><span>Referral Rewards</span><label class="switch"><input type="checkbox" checked onchange="savePref('ref', this.checked)"><span class="slider"></span></label></div>
            </div>
        </div>
    </div>

    <!-- Bottom Nav (left rail on desktop) -->
    <nav class="bottom-nav">
        <a href="dashboard.html" class="rail-brand" aria-label="TOP"><img src="assets/img/logo.svg" alt="TOP"></a>
        <a href="dashboard.html" class="nav-item">
            <i class="fas fa-th-large"></i>
            <span>Home</span>
        </a>
        <a href="plans.html" class="nav-item">
            <i class="fas fa-layer-group"></i>
            <span>Plans</span>
        </a>
        <a href="wallet.html" class="nav-item">
            <i class="fas fa-wallet"></i>
            <span>Wallet</span>
        </a>
        <a href="notifications.html" class="nav-item active">
            <i class="fas fa-bell"></i>
            <span>Alerts</span>
        </a>
        <a href="profile.html" class="nav-item">
            <i class="fas fa-user-circle"></i>
            <span>Profile</span>
        </a>
    </nav>

    <script type="module">
        const SB_URL = import.meta.env.VITE_SUPABASE_URL;
        const SB_KEY = import.meta.env.VITE_SUPABASE_ANON_KEY;
        const supabase = window.supabase.createClient(SB_URL, SB_KEY);

        let currentUser = null;
        let allNotifs = [];

        async function init() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }
            currentUser = session.user;

            await loadProfile();
            await fetchNotifs();
            setupRealtime();

            document.getElementById('notifSearch').addEventListener('input', applyFilters);
        }

        async function loadProfile() {
            const { data } = await supabase.from('profiles').select('full_name').eq('id', currentUser.id).single();
            if (data) document.getElementById('userAvatar').innerText = data.full_name.charAt(0).toUpperCase();
        }

        async function fetchNotifs() {
            const { data, error } = await supabase
                .from('notifications')
                .select('*')
                .eq('user_id', currentUser.id)
                .order('created_at', { ascending: false });

            if (data) {
                allNotifs = data;
                updateStats();
                applyFilters();
            }
        }

        function setupRealtime() {
            supabase.channel('custom-all-channel')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'notifications', filter: `user_id=eq.${currentUser.id}` }, (payload) => {
                fetchNotifs();
            })
            .subscribe();
        }

        function updateStats() {
            document.getElementById('totalCount').innerText = allNotifs.length;
            document.getElementById('unreadCount').innerText = allNotifs.filter(n => !n.is_read).length;
            const today = new Date().toDateString();
            document.getElementById('todayCount').innerText = allNotifs.filter(n => new Date(n.created_at).toDateString() === today).length;
        }

        function applyFilters() {
            const query = document.getElementById('notifSearch').value.toLowerCase();
            const tab = document.querySelector('.tab.active').innerText.toLowerCase();

            let filtered = allNotifs.filter(n => {
                const matchSearch = n.title.toLowerCase().includes(query) || n.message.toLowerCase().includes(query);
                let matchType = true;
                if (tab === 'unread') matchType = !n.is_read;
                else if (tab !== 'all') matchType = n.type === tab.slice(0, -1); // Simple mapping
                return matchSearch && matchType;
            });

            renderNotifs(filtered);
        }

        function renderNotifs(data) {
            const list = document.getElementById('notifList');
            list.innerHTML = '';

            if (data.length === 0) {
                list.innerHTML = `<div class="empty-state"><i class="fas fa-bell-slash"></i><p>No notifications found.</p></div>`;
                return;
            }

            data.forEach(n => {
                const date = new Date(n.created_at);
                const item = document.createElement('div');
                item.className = `notif-item ${n.is_read ? '' : 'unread'}`;
                
                const iconMap = {
                    deposit: 'fa-plus-circle', withdrawal: 'fa-arrow-down',
                    investment: 'fa-rocket', earning: 'fa-chart-line',
                    gift: 'fa-gift', referral: 'fa-users', system: 'fa-info-circle'
                };
                const icon = iconMap[n.type] || 'fa-bell';

                item.innerHTML = `
                    <div class="notif-icon"><i class="fas ${icon}"></i></div>
                    <div class="notif-body">
                        <h4>${n.title}</h4>
                        <p>${n.message}</p>
                        <div class="notif-time">${date.toLocaleDateString()} at ${date.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>
                        <div class="notif-actions">
                            <button class="btn-mini mark" onclick="toggleRead('${n.id}', ${n.is_read})">${n.is_read ? 'Mark Unread' : 'Mark Read'}</button>
                            <button class="btn-mini del" onclick="deleteNotif('${n.id}')">Delete</button>
                        </div>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        window.toggleRead = async (id, currentStatus) => {
            await supabase.from('notifications').update({ is_read: !currentStatus }).eq('id', id);
        };

        window.deleteNotif = async (id) => {
            await supabase.from('notifications').delete().eq('id', id);
        };

        window.markAllRead = async () => {
            await supabase.from('notifications').update({ is_read: true }).eq('user_id', currentUser.id).eq('is_read', false);
        };

        window.deleteAllRead = async () => {
            if(confirm("Delete all read notifications?")) {
                await supabase.from('notifications').delete().eq('user_id', currentUser.id).eq('is_read', true);
            }
        };

        window.filterNotifs = (type, btn) => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            applyFilters();
        };

        window.openSettings = () => document.getElementById('settingsModal').style.display = 'flex';
        window.closeSettings = () => document.getElementById('settingsModal').style.display = 'none';

        window.savePref = (key, val) => {
            console.log(`Setting ${key} to ${val}`);
            // Logic to persist in User Metadata or a Settings table
        };

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
