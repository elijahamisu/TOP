<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TOP - Premium Naira Investment</title>
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="assets/css/top.css">
    <meta name="theme-color" content="#E60000">
    <meta name="application-name" content="TOP">
    <style>
        body { background: radial-gradient(80% 50% at 50% 0%, #FFEDED 0%, rgba(255,245,245,0) 70%), #fff; }
        .btn .btn-text, .btn #btnText { display: block; }
    </style>
</head>
<body>

    <header class="topnav">
        <div class="container topnav-inner">
            <a href="index.html" class="brand" aria-label="TOP home"><img src="assets/img/logo.svg" alt="TOP"></a>
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Home</a>
        </div>
    </header>

    <main class="auth-shell">
        <div class="container">
            <div class="auth-card fade-up" style="margin:0 auto;">
                <div class="auth-head">
                    <img src="assets/img/logo-mark.svg" alt="">
                    <h1>Welcome Back</h1>
                    <p>Login to your TOP account and continue growing your investments.</p>
                </div>

                <div id="error-message" class="alert alert-error" role="alert"></div>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="email" class="form-control" placeholder="example@mail.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" class="form-control" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required>
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="btn btn-primary btn-lg btn-block btn-login" style="margin-top:8px;">
                        <span class="btn-text">Login to Account</span>
                        <div class="spinner" id="btnSpinner"></div>
                    </button>
                </form>

                <p class="auth-foot register-prompt">
                    Don't have an account? <a href="register.html">Register Now</a>
                </p>
                <div class="trust-row">
                    <span><i class="fas fa-lock"></i>Encrypted sign-in</span>
                    <span><i class="fas fa-shield-halved"></i>Protected wallet</span>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer" style="padding:28px 0;">
        <div class="container text-center">
            <div class="footer-links">
                <a href="index.html">Home</a>
                <a href="register.html">Register</a>
                <a href="support.html">Support</a>
                <a href="terms.html">Terms</a>
            </div>
            <p class="text-xs muted" style="margin-top:12px;">&copy; 2024 <span data-app-name>TOP</span>. All Rights Reserved.</p>
        </div>
    </footer>

    <script type="module">
        // Import environment variables (Vite pattern)
        // Since this is a static-like delivery in the prompt, 
        // we assume Vite handles the replacements in the final build.
        const SB_URL = import.meta.env.VITE_SUPABASE_URL;
        const SB_KEY = import.meta.env.VITE_SUPABASE_ANON_KEY;

        // Initialize Supabase
        const supabase = window.supabase.createClient(SB_URL, SB_KEY);

        const loginForm = document.getElementById('loginForm');
        const errorDiv = document.getElementById('error-message');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = submitBtn.querySelector('.btn-text');
        const btnSpinner = document.getElementById('btnSpinner');

        // Form Submission Logic
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            // Reset UI
            errorDiv.style.display = 'none';

            // Max Login Attempts (from platform settings): lock this email for 15 minutes
            const lockMsg = attemptLockMessage(email);
            if (lockMsg) {
                errorDiv.innerText = lockMsg;
                errorDiv.style.display = 'block';
                return;
            }
            setLoading(true);

            try {
                // 1. Basic Validation
                if (!email || !password) {
                    throw new Error("Please fill in all fields.");
                }

                // 2. Authenticate with Supabase
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) {
                    if (error.message.includes("Invalid login credentials")) {
                        const left = await recordFailedAttempt(email);
                        if (left === 0) throw new Error(attemptLockMessage(email));
                        if (left !== null && left <= 2) throw new Error(`Incorrect email or password. ${left} attempt${left === 1 ? '' : 's'} left before a 15-minute lock.`);
                    }
                    // Friendly error handling
                    if (error.message.includes("Invalid login credentials")) {
                        throw new Error("Incorrect email or password. Please try again.");
                    } else if (error.message.includes("Email not confirmed")) {
                        throw new Error("Please confirm your email address to login.");
                    } else {
                        throw new Error(error.message);
                    }
                }

                // 3. Success Logic
                if (data.user) {
                    clearAttempts(email);
                    localStorage.setItem('top_last_activity', String(Date.now()));
                    handleSuccessfulLogin();
                }

            } catch (err) {
                errorDiv.innerText = err.message;
                errorDiv.style.display = 'block';
                setLoading(false);
            }
        });

        // --- Login attempt limiting ---
        const LOCK_MINUTES = 15;
        const attemptsKey = (email) => 'top_login_attempts_' + email.toLowerCase();
        const readAttempts = (email) => {
            try { return JSON.parse(localStorage.getItem(attemptsKey(email))) || { count: 0, lockedUntil: 0 }; }
            catch { return { count: 0, lockedUntil: 0 }; }
        };
        function attemptLockMessage(email) {
            if (!email) return null;
            const a = readAttempts(email);
            if (a.lockedUntil && Date.now() < a.lockedUntil) {
                const mins = Math.ceil((a.lockedUntil - Date.now()) / 60000);
                return `Too many failed attempts. Try again in ${mins} minute${mins === 1 ? '' : 's'}.`;
            }
            return null;
        }
        async function recordFailedAttempt(email) {
            const s = await (window.TOPSettings || Promise.resolve({}));
            const max = Number(s.max_login_attempts) || 0;
            if (max <= 0) return null;
            const a = readAttempts(email);
            if (a.lockedUntil && Date.now() >= a.lockedUntil) { a.count = 0; a.lockedUntil = 0; }
            a.count += 1;
            if (a.count >= max) { a.lockedUntil = Date.now() + LOCK_MINUTES * 60000; a.count = 0; }
            localStorage.setItem(attemptsKey(email), JSON.stringify(a));
            return a.lockedUntil ? 0 : max - a.count;
        }
        function clearAttempts(email) { localStorage.removeItem(attemptsKey(email)); }

        if (new URLSearchParams(location.search).get('expired')) {
            errorDiv.innerText = 'You were signed out after a period of inactivity. Please log in again.';
            errorDiv.style.display = 'block';
        }

        function setLoading(isLoading) {
            if (isLoading) {
                submitBtn.disabled = true;
                btnText.style.display = 'none';
                btnSpinner.style.display = 'block';
            } else {
                submitBtn.disabled = false;
                btnText.style.display = 'block';
                btnSpinner.style.display = 'none';
            }
        }

        function handleSuccessfulLogin() {
            // The Telegram popup now shows on the dashboard (editable in Admin > Settings).
            window.location.href = 'dashboard.html';
        }

    </script>
    <script type="module" src="/assets/js/platform.js"></script>
</body>
</html>
